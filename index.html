<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-B/GM4XqrwHnWXNOWMbloTmrYXZg10cakYGmpfsR/bbzQ6JAJI4ihuyADKLnBgrCe" crossorigin="anonymous">
    <script src="https://kit.fontawesome.com/899adebda7.js" crossorigin="anonymous"></script>
</head>

<body data-bs-theme="">
    <div class="col-5 h2 border border-dark rounded-3 p-3 mt-5 mx-auto /bg-black">
        <div class="col-12 d-flex justify-content-center align-items-center ">
            <div class="offset-md-4 text-center m-0">
                <h1>Calculator</h1>
                <div id="result" class="form-control mb-3">0</div>
                <div role="group" class="mb-3 d-flex justify-content-center justify-content-between rounded-3">
                    <button type="button" class="btn btn-secondary border-0 rounded-9" onclick="deletechar('delete')"><svg xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px" fill="#1f1f1f"><path d="m456-320 104-104 104 104 56-56-104-104 104-104-56-56-104 104-104-104-56 56 104 104-104 104 56 56Zm-96 160q-19 0-36-8.5T296-192L80-480l216-288q11-15 28-23.5t36-8.5h440q33 0 56.5 23.5T880-720v480q0 33-23.5 56.5T800-160H360ZM180-480l180 240h440v-480H360L180-480Zm400 0Z"/></svg></button>
                    <button type="button" class="btn btn-secondary border-0 rounded-9" onclick="clearAll('AC')"><b>AC</b></button>
                    <button type="button" class="btn btn-secondary border-0 rounded-9" onclick="appendToResult('%')"><b>%</b></button>
                    <button type="button" class="btn btn-secondary bg-warning border-0 rounded-9" onclick="appendToResult('/')"><b>&#247;</b></button>
                </div>
                <div role="group" class="mb-3 d-flex justify-content-center justify-content-between rounded-3">
                    <button type="button" class="btn btn-secondary border-0 rounded-9" onclick="appendToResult('7')"><b>7</b></button>
                    <button type="button" class="btn btn-secondary border-0 rounded-9" onclick="appendToResult('8')"><b>8</b></button>
                    <button type="button" class="btn btn-secondary border-0 rounded-9" onclick="appendToResult('9')"><b>9</b></button>
                    <button type="button" class="btn btn-secondary bg-warning border-0 rounded-9" onclick="appendToResult('*')"><b>X</b></button>
                </div>
                <div role="group" class="mb-3 d-flex justify-content-center justify-content-between rounded-3">
                    <button type="button" class="btn btn-secondary border-0 rounded-9" onclick="appendToResult('4')"><b>4</b></button>
                    <button type="button" class="btn btn-secondary border-0 rounded-9" onclick="appendToResult('5')"><b>5</b></button>
                    <button type="button" class="btn btn-secondary border-0 rounded-9" onclick="appendToResult('6')"><b>6</b></button>
                    <button type="button" class="btn btn-secondary bg-warning border-0 rounded-9" onclick="appendToResult('-')"><b>-</b></button>
                </div>
                <div role="group" class="mb-3 d-flex justify-content-center justify-content-between rounded-3">
                    <button type="button" class="btn btn-secondary border-0 rounded-9" onclick="appendToResult('1')"><b>1</b></button>
                    <button type="button" class="btn btn-secondary border-0 rounded-9" onclick="appendToResult('2')"><b>2</b></button>
                    <button type="button" class="btn btn-secondary border-0 rounded-9" aria-label="3" onclick="appendToResult('3')"><b>3</b></button>
                    <button type="button" class="btn btn-secondary bg-warning border-0 rounded-9" onclick="appendToResult('+')"><b>+</b></button>
                </div>
                <div role="group" class="mb-3 d-flex justify-content-center justify-content-between rounded-3">
                    <button type="button" class="btn btn-secondary border-0 rounded-9" onclick="appendToResult('+/-')"><b>+/-</b></button>
                    <button type="button" class="btn btn-secondary border-0 rounded-9" aria-label="0" onclick="appendToResult('0')"><b>0</b></button>
                    <button type="button" class="btn btn-secondary border-0 rounded-9" onclick="appendToResult('.')"><b>.</b></button>
                    <button type="button" class="btn btn-secondary bg-warning border-0 rounded-9" onclick="calculate('=')"><b>=</b></button>
                </div>
            </div>
        </div>
    </div>


    <script src="Cal.js"></script>
</body>

</html>
